spring.datasource.url=jdbc:mysql://172.18.0.7:3306/bike_db?useUnicode=true&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.thymeleaf.cache=false
#JPA SETTINGS
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
#FLYWAY SETTINGS
spring.flyway.url=jdbc:mysql://172.18.0.7:3306/bike_db?useUnicode=true&useSSL=false&JDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.flyway.user=root
spring.flyway.password=password
spring.flyway.locations=classpath:db/migration
#Token settings
token.expiration.time=8640000000

##Kafka settings
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.properties.schema.registy.url=http://localhost:32181

#RabbitMq settings
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

spring.cache.type=redis
spring.redis.host=redis_cache
spring.redis.port=6379
spring.cache.redis.cache-null-values=true
spring.cache.redis.time-to-live=259200000000

logging.level.org.springframework=DEBUG
